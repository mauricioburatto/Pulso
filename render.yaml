# Blueprint do Render (https://render.com/docs/blueprint-spec) — provisiona
# o backend do Pulso e o Postgres juntos. Uso opcional: dá pra criar os
# dois serviços manualmente pelo dashboard também. Railway não usa este
# arquivo (auto-detecta o Node a partir de server/package.json).
databases:
  - name: pulso-db
    plan: free
    databaseName: pulso
    user: pulso

services:
  - type: web
    name: pulso-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulso-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_PUBLIC_URL_BASE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
